function llistaAleatoris(){
  let llista=[];
  let n=0;
  while (llista.length<80){
    //generam el nombre
    n = Math.floor((Math.random() * 80));
    //comprovam que no és dins la llista
    if (llista.indexOf(n)==-1){llista.push(n);} 
  }
  return llista;  
}
